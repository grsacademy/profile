<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 명함 생성기 (관리자용)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
    .editor-panel { background: white; padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
    h3 { margin: 0 0 20px 0; color: #111; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    label { font-size: 13px; font-weight: 700; color: #666; }
    input { padding: 14px; border: 1px solid #e1e4e8; border-radius: 12px; font-family: inherit; font-size: 14px; }
    .btn-generate { width: 100%; padding: 16px; background: #c77134; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
    #result-link { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 13px; word-break: break-all; display: none; }
  </style>
</head>
<body>

  <div class="editor-panel">
    <h3>명함 정보 입력</h3>
    
    <div class="input-group">
      <label>사진 URL (흑백 권장)</label>
      <input type="text" id="in-pic" value="https://raw.githubusercontent.com/orioncactus/pretendard/main/pretendard/images/og-image.png">
    </div>
    <div class="input-group">
      <label>이름</label>
      <input type="text" id="in-name" value="김승태">
    </div>
    <div class="input-group">
      <label>직무 / 부서</label>
      <input type="text" id="in-role" value="HRD 기획 및 운영 | 인재육성팀">
    </div>
    <div class="input-group">
      <label>태그 1</label>
      <input type="text" id="in-tag1" value="교육기획">
    </div>
    <div class="input-group">
      <label>태그 2</label>
      <input type="text" id="in-tag2" value="SCA트레이너">
    </div>
    <div class="input-group">
      <label>연락처</label>
      <input type="text" id="in-phone" value="010-1234-5678">
    </div>
    <div class="input-group">
      <label>이메일</label>
      <input type="text" id="in-email" value="seungtae_kim@lotte.net">
    </div>
    
    <button class="btn-generate" onclick="generateLink()">명함 링크 생성 및 복사</button>
    <div id="result-link"></div>
  </div>

  <script>
    function generateLink() {
      // 1. 입력된 데이터 가져오기
      const data = {
        pic: document.getElementById('in-pic').value,
        name: document.getElementById('in-name').value,
        role: document.getElementById('in-role').value,
        tag1: document.getElementById('in-tag1').value,
        tag2: document.getElementById('in-tag2').value,
        phone: document.getElementById('in-phone').value,
        email: document.getElementById('in-email').value
      };

      // 2. URL 쿼리 파라미터로 변환 (한글 및 특수문자 안전하게 인코딩)
      const params = new URLSearchParams(data).toString();
      
      // 3. 뷰어 페이지(card.html)의 주소 조합
      // 실제 호스팅 주소에 맞춰 경로를 조정해야 합니다. (아래는 같은 폴더에 있다고 가정)
      const baseUrl = window.location.href.replace('index.html', '').replace(/\/$/, '');
      const finalUrl = `${baseUrl}/card.html?${params}`;

      // 4. 클립보드에 복사 및 결과 표시
      navigator.clipboard.writeText(finalUrl).then(() => {
        const resultDiv = document.getElementById('result-link');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<strong>링크가 복사되었습니다!</strong><br><br><a href="${finalUrl}" target="_blank">${finalUrl}</a><br><br>이 링크를 상대방에게 전달하세요.`;
      });
    }
  </script>
</body>
</html>
