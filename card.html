<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털 명함</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  
  <style>
    /* 뷰어는 모바일 화면에 꽉 차도록 세팅 */
    body { 
      font-family: 'Pretendard', sans-serif; 
      background: #000; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh;
    }
    
    .card { 
      width: 100%; 
      max-width: 400px;
      min-height: 100vh; /* 모바일 풀화면 */
      background: #111; 
      position: relative; 
      display: flex;
      flex-direction: column;
    }
    
    .card-cover { height: 35vh; background-size: cover; background-position: center; position: relative; }
    
    .card-header-wrapper { padding: 0 20px; margin-top: -50px; z-index: 10; }
    .card-header { background: #c77134; border-radius: 20px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .card-name { margin: 0; font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .card-role-wrapper { margin-top: 10px; }
    .card-role { font-size: 14px; color: #fff; font-weight: 500; line-height: 1.4;}
    
    .tag-group { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap;}
    .tag-btn { padding: 8px 14px; background: rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 13px; font-weight: 600; }
    
    .info-list { padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
    .info-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .info-label { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6); }
    .info-value-wrapper { display: flex; align-items: center; gap: 10px; }
    .info-value { font-size: 15px; font-weight: 600; color: #fff; text-align: right; }
    .info-arrow { color: rgba(255,255,255,0.4); font-size: 14px; }
    
    .phone-link { color: #fff; text-decoration: none; }
    .phone-link:hover { color: #c77134; }
    
    .btn-download-wrapper { padding: 20px; margin-top: auto; padding-bottom: 40px; }
    .btn-download { width: 100%; padding: 16px; background: #333; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card" id="business-card">
    <div class="card-cover" id="out-pic"></div>
    
    <div class="card-header-wrapper">
      <div class="card-header">
        <h2 class="card-name" id="out-name">이름</h2>
        <div class="card-role-wrapper">
          <div class="card-role" id="out-role">직무</div>
        </div>
        <div class="tag-group">
          <div class="tag-btn" id="out-tag1">태그1</div>
          <div class="tag-btn" id="out-tag2">태그2</div>
        </div>
      </div>
    </div>
    
    <div class="info-list">
      <div class="info-item">
        <div class="info-label">휴대전화</div>
        <div class="info-value-wrapper">
          <a href="#" class="info-value phone-link" id="out-phone-link">
            <span id="out-phone-text">010-0000-0000</span>
          </a>
          <div class="info-arrow">›</div>
        </div>
      </div>
      <div class="info-item">
        <div class="info-label">이메일</div>
        <div class="info-value-wrapper">
          <div class="info-value" id="out-email">email@example.com</div>
          <div class="info-arrow">›</div>
        </div>
      </div>
    </div>

    <!-- 캡처 영역에서 버튼을 제외하기 위해 분리 -->
    <div class="btn-download-wrapper" data-html2canvas-ignore="true">
      <button class="btn-download" onclick="downloadCard()">명함 이미지로 저장</button>
    </div>
  </div>

  <script>
    // URL 주소에서 파라미터(?name=xxx&role=xxx) 추출
    const urlParams = new URLSearchParams(window.location.search);

    // 파라미터가 있으면 화면에 매핑
    if(urlParams.has('name')) {
      document.getElementById('out-pic').style.backgroundImage = `url('${urlParams.get('pic')}')`;
      document.getElementById('out-name').innerText = urlParams.get('name');
      document.getElementById('out-role').innerText = urlParams.get('role');
      document.getElementById('out-tag1').innerText = urlParams.get('tag1');
      document.getElementById('out-tag2').innerText = urlParams.get('tag2');
      document.getElementById('out-email').innerText = urlParams.get('email');
      
      const phoneVal = urlParams.get('phone');
      document.getElementById('out-phone-text').innerText = phoneVal;
      document.getElementById('out-phone-link').href = 'tel:' + phoneVal.replace(/[^0-9+]/g, '');
    }

    // 이미지 저장 기능
    function downloadCard() {
      const card = document.getElementById('business-card');
      
      html2canvas(card, { 
        scale: 3, 
        useCORS: true,
        backgroundColor: '#111'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${urlParams.get('name') || '디지털'}_명함.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
